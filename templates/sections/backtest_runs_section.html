{% load i18n %}
<div
    id="section-{{ section_key }}"
    class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg shadow-sm mb-6 overflow-hidden"
    x-data="{
        isLoaded: {{ is_loaded|yesno:'true,false' }},
        isLoading: false,
        isCollapsed: {{ collapsible|yesno:'true,false' }},
        modalOpen: false,
        modalTitle: '',
        modalType: '',
        modalContent: '',
        modalUrl: '',
        modalLoading: false,

        loadSection() {
            if (this.isLoaded || this.isLoading) return;
            this.isLoading = true;
            this.$refs.content.innerHTML = `<div class='flex flex-col items-center justify-center p-8 text-center w-full gap-2'><span class='material-symbols-outlined animate-spin text-3xl text-primary-600 dark:text-primary-400'>progress_activity</span><span class='text-xs text-gray-500 font-medium animate-pulse'>{% trans 'Loading backtest runs...' %}</span></div>`;
            
            let url = '{{ refresh_url }}';
            if (!url.startsWith('/') && !url.startsWith('http')) {
                const baseUrl = typeof getAdminBaseUrl === 'function' ? getAdminBaseUrl() : '{{ request.path }}'.replace(/\/\d+\/change\/?$/, '');
                url = `${baseUrl.replace(/\/$/, '')}/${url}`;
            }
            fetch(url)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(data => {
                    if (window.setHTMLWithScripts) {
                        window.setHTMLWithScripts(this.$refs.content, data.html);
                    } else {
                        this.$refs.content.innerHTML = data.html;
                    }
                    this.isLoaded = true;
                })
                .catch(err => {
                    this.$refs.content.innerHTML = `<div class='p-4 text-xs text-red-500'>{% trans 'Failed to load runs.' %}</div>`;
                })
                .finally(() => this.isLoading = false);
        },

        openPopup(runId, contentType, title) {
            const baseUrl = typeof getAdminBaseUrl === 'function' ? getAdminBaseUrl() : '{{ request.path }}'.replace(/\/\d+\/change\/?$/, '');
            const targetUrl = `${baseUrl.replace(/\/$/, '')}/run-content/${runId}/${contentType}/`;
            this.modalTitle = title || `Run #${runId} - ${contentType.toUpperCase()}`;
            this.modalType = contentType;
            this.modalUrl = targetUrl;
            this.modalOpen = true;
            this.modalLoading = true;
            this.modalContent = '';

            if (contentType === 'html') {
                this.modalLoading = false;
            } else {
                fetch(`${targetUrl}?format=json`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(r => r.json())
                .then(data => {
                    this.modalTitle = data.title || this.modalTitle;
                    this.modalContent = data.content || '';
                })
                .catch(err => {
                    this.modalContent = 'Error loading content: ' + err;
                })
                .finally(() => {
                    this.modalLoading = false;
                });
            }
        },

        copyContent() {
            if (this.modalContent) {
                navigator.clipboard.writeText(this.modalContent);
                alert('Copied to clipboard!');
            }
        }
    }"
    x-init="if (!isCollapsed) { loadSection(); }"
>
    <!-- Section Header -->
    <div class="flex items-center justify-between w-full px-4 py-3 border-b border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-950/50">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary-600 dark:text-primary-400 text-[20px]">history</span>
            <h3 class="text-sm font-semibold text-gray-900 dark:text-white">{{ title }}</h3>
        </div>
        <div class="flex items-center gap-x-2">
            <button type="button" 
                    @click.stop="isLoaded = false; loadSection()"
                    class="cursor-pointer inline-flex items-center gap-1.5 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-primary-600 hover:text-primary-500 dark:text-primary-400 transition-colors group"
                    title="{% trans 'Refresh Runs' %}">
                <span class="material-symbols-outlined text-[16px] group-hover:rotate-180 transition-transform duration-500">refresh</span>
            </button>
            {% if collapsible %}
                <button @click="isCollapsed = !isCollapsed; if (!isCollapsed) loadSection();" 
                        type="button" 
                        class="flex items-center justify-center w-7 h-7 text-gray-400 transition-colors rounded-full hover:bg-gray-100 hover:text-gray-500 dark:hover:bg-gray-800 dark:hover:text-gray-300">
                    <span class="material-symbols-outlined text-[18px]" x-text="isCollapsed ? 'expand_more' : 'expand_less'"></span>
                </button>
            {% endif %}
        </div>
    </div>

    <!-- Section Body -->
    <div x-show="!isCollapsed" style="display: none;">
        <div x-ref="content" class="p-3">
            <div class="flex items-center justify-center py-6 text-xs text-gray-400 dark:text-gray-500 gap-2">
                <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
                <span>{% trans "Loading runs..." %}</span>
            </div>
        </div>
    </div>

    <!-- Interactive Popup Modal for Logs / HTML / Code -->
    <div
        x-show="modalOpen"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
        style="display: none;"
        @click.self="modalOpen = false"
        @keydown.escape.window="modalOpen = false"
    >
        <div
            class="relative w-full max-w-5xl bg-white dark:bg-gray-900 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-800 overflow-hidden flex flex-col max-h-[90vh]"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
        >
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-950">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary-600 dark:text-primary-400 text-[20px]"
                          x-text="modalType === 'html' ? 'analytics' : (modalType === 'code' ? 'code' : 'terminal')"></span>
                    <h4 class="text-sm font-bold text-gray-900 dark:text-gray-100" x-text="modalTitle"></h4>
                </div>
                <div class="flex items-center gap-2">
                    <template x-if="modalType === 'log' || modalType === 'code'">
                        <button type="button"
                                @click="copyContent()"
                                class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-medium rounded text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition"
                                title="{% trans 'Copy to clipboard' %}">
                            <span class="material-symbols-outlined text-[16px]">content_copy</span>
                            <span>{% trans "Copy" %}</span>
                        </button>
                    </template>
                    <a :href="modalUrl" target="_blank"
                       class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-medium rounded text-primary-600 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-950 transition"
                       title="{% trans 'Open in new window / tab' %}">
                        <span class="material-symbols-outlined text-[16px]">open_in_new</span>
                        <span>{% trans "New Window" %}</span>
                    </a>
                    <button type="button"
                            @click="modalOpen = false"
                            class="p-1 rounded-full text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-800 transition">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 overflow-auto bg-gray-900">
                <template x-if="modalLoading">
                    <div class="flex flex-col items-center justify-center p-16 text-center text-gray-400 gap-3">
                        <span class="material-symbols-outlined animate-spin text-4xl text-primary-500">progress_activity</span>
                        <span class="text-xs font-medium">{% trans "Loading content..." %}</span>
                    </div>
                </template>
                <template x-if="!modalLoading && modalType === 'html'">
                    <iframe :src="modalUrl" class="w-full h-[75vh] border-0 bg-white"></iframe>
                </template>
                <template x-if="!modalLoading && (modalType === 'log' || modalType === 'code' || modalType === 'config')">
                    <pre class="p-5 font-mono text-xs text-gray-100 overflow-auto max-h-[75vh] whitespace-pre leading-relaxed select-text"><code x-text="modalContent"></code></pre>
                </template>
            </div>
        </div>
    </div>
</div>
